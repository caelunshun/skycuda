[package]
name = "skycuda"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "skycuda-cublaslt", "skycuda-cudnn", "skycuda-cudnn-sys"]

[workspace.dependencies]
cudarc = { git = "https://github.com/caelunshun/cudarc", branch = "cuda-13-4", default-features = false, features = [
    "cuda-version-from-build-system",
    "dynamic-loading",
    "driver",
    "std",
] }

[dependencies]
cudarc = { workspace = true }
thiserror = "2.0"
bytemuck = "1.25"
range-alloc = "0.1.5"
bumpalo = "3.20"
half = { version = "2.7", features = ["bytemuck"] }
tracing = "0.1"
bytesize = "2.7"

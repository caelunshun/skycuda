[package]
name = "skycuda-cublaslt"
version = "0.1.0"
edition = "2024"

[dependencies]
skycuda = { path = ".." }
cudarc = { workspace = true, features = ["cublaslt"] }
thiserror = "2"
bytemuck = "1"
half = { version = "2", features = ["bytemuck"] }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
half = { version = "2", features = ["bytemuck"] }
bytemuck = "1"

[features]
default = []
tracing = ["dep:tracing"]
